<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asientos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="sala-cine" class="sala-cine">

        <div class="pantalla-curva"></div>

    <div class="contenedor-asientos">

                    <div class="asiento" data-id="A1">1</div>

                    <div class="asiento" data-id="C3">3</div>

                    <div class="pasillo"></div>
                    <div class="asiento" data-id="C7">7</div>
                    <div class="asiento" data-id="C8">8</div>
                </div>

                <div class="fila">
                    <span class="fila-letra">D</span>
                    <div class="asiento" data-id="D1">1</div>
                    <div class="asiento" data-id="D2">2</div>
                    <div class="pasillo"></div>

                <li><div class="asiento-seleccionado"></div> Seleccionado</li>

            <div class="resumen-compra">

                    <p class="resumen-texto">Asientos: <span id="lista-asientos">-</span></p>
                    <p class="resumen-total">Total: $<span id="precio-total">0</span></p>
                </div>
                <button class="btn-neon" id="btn-comprar-final" disabled>Continuar</button>
            </div>
    </section>
    <script src="script.js"></script>

</html>
